# --- metadata ---
# pattern_id: account-mapping-large-scale
# name: Large-Scale Account-to-Name Mapping
# complexity: intermediate
# tags: [account, Group, mapping, Child, quoted-ids, inline-comments, sections]
# source_pattern: [customer-d]
# use_when: >
#   Map a large number of AWS accounts to human-readable names when accounts
#   are grouped into business units or product lines. Section comments improve
#   maintainability. Inline comments on account IDs keep the mapping auditable
#   without a separate roster file. Use expanded list format (one entry per
#   line) whenever inline comments are present — collapsing to array notation
#   would discard the comments.
# prerequisites: [account IDs known, accounts grouped by business unit]
# teaches:
#   - Section comment blocks for large rule lists
#   - Inline comments on account IDs for traceability
#   - Expanded list format required when inline comments exist
#   - Child hierarchy for drill-down
# anti_patterns:
#   - Collapsing to array notation when inline comments are present
#   - Mixing section comment styles within one file
#   - Unquoted 12-digit account IDs

Dimensions:
  AccountName:
    Name: Account Name
    Child: Service
    Source: Account
    Rules:

      #--------------------------------------------
      # Consumer Products
      #--------------------------------------------

      - Type: Group
        Name: consumer-web-prod
        Conditions:
          - Equals: '111111111111'  # consumer-web-prod

      - Type: Group
        Name: consumer-web-staging
        Conditions:
          - Equals: '111111111112'  # consumer-web-staging

      - Type: Group
        Name: consumer-web-dev
        Conditions:
          - Equals: '111111111113'  # consumer-web-dev

      - Type: Group
