# --- metadata ---
# pattern_id: account-mapping-basic
# name: Basic Account-to-Name Mapping
# complexity: basic
# tags: [account, Group, mapping, Child, quoted-ids]
# source_pattern: [customer-d]
# use_when: >
#   Map AWS account IDs to human-readable names when your org has a small,
#   stable set of accounts. Pair with Child: Service so users can drill from
#   account into per-service spend without a second dimension.
# prerequisites: [account IDs known]
# teaches: [Group rules, Account source, quoted account IDs, Child hierarchy]
# anti_patterns:
#   - unquoted account IDs (YAML may coerce 12-digit numbers incorrectly)
#   - omitting Child when the dimension is the primary account-level view
#   - adding DefaultValue unless you want a named catch-all shown in reports

Dimensions:
  AccountName:
    Name: Account Name
    Child: Service
    Source: Account
    Rules:
      - Type: Group
        Name: app-prod-east
        Conditions:
          - Equals: '347508672966'

