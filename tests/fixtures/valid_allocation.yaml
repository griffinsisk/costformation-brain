Dimensions:
  SpendCategory:
    Name: Spend Category
    Hide: true
    Rules:
      - Type: Group
        Name: Shared
        Conditions:
          - Source: Tag:cost-pool
            Equals: shared

  SharedAllocation:
    Name: Shared Allocation
    Type: Allocation
    Hide: true
    AllocateByStreams:
      Streams:
        - shared_usage_stream

  TeamCosts:
    Name: Team Costs
    Child: Service
    Rules:
      - Type: GroupBy
        Sources:
          - User:Defined:SharedAllocation
          - User:Defined:SpendCategory
        CoalesceSources: true
